[package]
name = "annas-archive-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
annas-archive-api = { path = "../annas-archive-api" }
anyhow = "1.0"
rmcp = { version = "0.14", features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
