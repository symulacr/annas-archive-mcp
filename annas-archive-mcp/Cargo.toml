[package]
name = "annas-archive-mcp"
version = "0.1.1"
edition = "2024"
description = "MCP server for Anna's Archive - search and retrieve books, papers, and documents"
license = "MIT"
repository = "https://github.com/RemiKalbe/annas-archive-mcp"
keywords = ["annas-archive", "mcp", "books", "library"]
categories = ["command-line-utilities"]

[dependencies]
annas-archive-api = { version = "0.2.0", path = "../annas-archive-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.0", features = ["macros", "rt", "io-util", "io-std"] }

# dev-only: tokio's test clock (stdio watchdog gap tests run paused, so a
# 30 s timeout is exercised in microseconds) + duplex io for the raw
# NDJSON wire-harness tests.
[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt", "test-util", "io-util"] }
