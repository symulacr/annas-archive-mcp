name: Release

on:
  push:
    tags:
      - 'annas-archive-api-v*'
      - 'annas-archive-mcp-v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 (musl for static binary)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
          # Linux ARM64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_zigbuild: true
          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-latest
            use_zigbuild: false
          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            use_zigbuild: false
          # Windows x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_zigbuild: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        run: |
          pip3 install ziglang
          cargo install cargo-zigbuild

      - name: Build (zigbuild)
        if: matrix.use_zigbuild
        run: cargo zigbuild --release --target ${{ matrix.target }} -p annas-archive-mcp

      - name: Build (native)
        if: ${{ !matrix.use_zigbuild }}
        run: cargo build --release --target ${{ matrix.target }} -p annas-archive-mcp

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../annas-archive-mcp-${{ github.ref_name }}-${{ matrix.target }}.tar.gz annas-archive-mcp

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../annas-archive-mcp-${{ github.ref_name }}-${{ matrix.target }}.zip annas-archive-mcp.exe

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            annas-archive-mcp-*.tar.gz
            annas-archive-mcp-*.zip

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          sha256sum annas-archive-mcp-*.tar.gz annas-archive-mcp-*.zip 2>/dev/null > SHA256SUMS.txt || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            annas-archive-mcp-*.tar.gz
            annas-archive-mcp-*.zip
            SHA256SUMS.txt
